<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - Edit</title>
    <link rel="stylesheet" href="./style.css" />
        <link rel="icon" href="./favicon_io/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <button id="menuToggle" aria-label="Open menu">☰</button>

    <nav>
      <a href="/home">home</a>
      <a href="/market">market</a>
      <a href="/post">post</a>
      <a href="/about">about</a>
    </nav>

    <header id="headerEdit">
      <h1 id="titleEdit">Edit</h1>
    </header>

    <main id="mainEdit">
      <div id="editBox">
        <form id="editForm">
          <input type="text" name="title" placeholder="Title" required />
          <textarea
            name="description"
            placeholder="Description"
            required
          ></textarea>
          <select name="category" required>
            <option value="">Category</option>
            <option value="Automotive">Automotive</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Furniture">Furniture</option>
            <option value="Hobby">Hobby</option>
          </select>
          <input
            type="number"
            name="price"
            step="0.01"
            placeholder="Price"
            required
          />
          <select name="condition">
            <option value="">Condition</option>
            <option value="New">New</option>
            <option value="Used Good">Used - Good</option>
            <option value="Used Poor">Used - Poor</option>
          </select>
          <input type="text" name="location" placeholder="Location" />
          <button type="reset">Reset</button>
          <button type="submit">Edit</button>
        </form>
      </div>
    </main>

    <script type="module" src="./js/editScripts/script.js"></script>
  </body>
</html>
